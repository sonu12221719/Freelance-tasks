<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Strength Tester</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              montserrat: ["Montserrat", "sans-serif"],
              opensans: ["Open Sans", "sans-serif"],
            },
            colors: {
              dark: {
                primary: '#111111',
                secondary: '#222222',
              }
            }
          },
        },
      };
    </script>
    <style>
      /* Remove default password field eye icon */
      input[type="password"]::-ms-reveal,
      input[type="password"]::-ms-clear {
        display: none;
      }
      input[type="password"]::-webkit-credentials-auto-fill-button {
        display: none !important;
      }
    </style>
  </head>
  <body
    class="flex flex-col items-center justify-center bg-green-50 dark:bg-dark-primary font-opensans transition-colors duration-200"
  >
    <header class="w-full">
      <nav
        class="w-full sm:rounded-full sm:w-4/5 bg-white dark:bg-[#222222] mx-auto sm:mt-10 p-6 flex justify-between items-center shadow-lg"
      >
        <h2 class="text-md sm:text-4xl font-bold px-6 font-montserrat text-black dark:text-white">
          Password Strength Tester
        </h2>
        <button
          id="themeToggle"
          class="p-2 rounded-full hover:bg-white/20 transition-colors duration-200"
          aria-label="Toggle theme"
        >
          <svg
            id="sunIcon"
            class="w-4 sm:w-6 h-4 sm:h-6 text-black dark:text-white hidden"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
          <svg
            id="moonIcon"
            class="w-4 sm:w-6 h-4 sm:h-6 text-black dark:text-white"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
        </button>
      </nav>
    </header>

    <h1 class="text-2xl sm:text-5xl font-bold font-montserrat dark:text-white text-center mt-16">Check How secure is your password?</h1>
    <div class="w-full sm:w-3/5 flex flex-col sm:flex-row items-center justify-center sm:justify-between p-2 mt-8 sm:mt-16 text-base sm:text-xl">
        <p class="font-opensans dark:text-gray-300 text-center sm:text-left"><span class="font-bold font-montserrat">Tip:</span> Stronger passwords use different types of characters</p>
        <div class="flex items-center gap-2 mt-4 sm:mt-0">
            <label for="showPassword" class="cursor-pointer font-opensans dark:text-gray-300">Show Password</label>
            <input type="checkbox" id="showPassword" class="w-4 h-4 rounded border-gray-300 text-[#73946B] focus:ring-[#73946B] dark:border-gray-600 dark:bg-dark-secondary dark:ring-offset-dark-primary dark:focus:ring-[#4A6145]">
        </div>
    </div>

    <div class="container w-full sm:w-3/5 flex flex-col items-center justify-center mt-2 px-4 sm:px-0">
      <div
        class="bg-white dark:bg-dark-secondary p-4 sm:p-6 rounded-lg shadow-lg w-full text-center transition-colors duration-200"
      >
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="off"
          class="w-full p-4 sm:p-6 my-2.5 text-center border-2 border-gray-300 dark:border-none rounded focus:border-none focus:outline-none focus:ring-2 focus:ring-[#73946B] dark:bg-dark-primary dark:text-white transition-colors duration-200 text-base sm:text-lg"
        />
        <p id="strength" class="text-center text-sm sm:text-base font-opensans">No Password</p>
    </div>
        <div class="w-full mb-2 space-y-2 sm:space-y-1 text-left flex flex-col sm:flex-row sm:items-center sm:justify-between p-4">
            <p class="dark:text-gray-300 text-sm flex flex-row justify-between sm:flex-row sm:items-center sm:justify-between sm:text-base">
                <span class="font-montserrat">Total characters:</span>
                <span id="totalChars" class="font-opensans"> 0</span>
            </p>
            <p class="dark:text-gray-300 text-sm flex flex-row justify-between sm:flex-row sm:items-center sm:justify-between sm:text-base">
                <span class="font-montserrat">Lower Case:</span>
                <span id="lowerChars" class="font-opensans"> 0</span>
            </p>
            <p class="dark:text-gray-300 text-sm flex flex-row justify-between sm:flex-row sm:items-center sm:justify-between sm:text-base">
                <span class="font-montserrat">Upper Case:</span>
                <span id="upperChars" class="font-opensans"> 0</span>
            </p>
            <p class="dark:text-gray-300 text-sm flex flex-row justify-between sm:flex-row sm:items-center sm:justify-between sm:text-base">
                <span class="font-montserrat">Numbers:</span>
                <span id="numberChars" class="font-opensans"> 0</span>
            </p>
            <p class="dark:text-gray-300 text-sm flex flex-row justify-between sm:flex-row sm:items-center sm:justify-between sm:text-base">
                <span class="font-montserrat">Symbols:</span>
                <span id="symbolChars" class="font-opensans"> 0</span>
            </p>
        </div>
    </div>

    <div id="time" class="flex flex-col items-center justify-center my-4 text-gray-700 dark:text-gray-300 p-4 sm:p-6 w-full sm:w-auto px-4 sm:px-6">
      <div class="font-montserrat font-bold text-xl sm:text-2xl mb-2">Time to crack:</div>
      <div id="timeToCrack" class="font-opensans text-lg sm:text-xl">0 Second</div>
    </div>
    
    <div>
        
    </div>
    </div>

    <footer class="w-full py-6 mt-2 text-center">
      <p class="text-sm text-gray-600 dark:text-gray-400 font-opensans">
        © 2024 Password Strength Tester. All rights reserved.
      </p>
    </footer>

    <script>
      const passwordInput = document.getElementById("password");
      const strengthDiv = document.getElementById("strength");
      const timeDiv = document.getElementById("time");
      const reasonDiv = document.getElementById("reason");
      const themeToggle = document.getElementById("themeToggle");
      const sunIcon = document.getElementById("sunIcon");
      const moonIcon = document.getElementById("moonIcon");
      const showPasswordCheckbox = document.getElementById("showPassword");

      // Character count elements
      const totalChars = document.getElementById("totalChars");
      const lowerChars = document.getElementById("lowerChars");
      const upperChars = document.getElementById("upperChars");
      const numberChars = document.getElementById("numberChars");
      const symbolChars = document.getElementById("symbolChars");

      function updateCharacterCounts(password) {
        // Update total characters
        totalChars.textContent = password.length;

        // Count character types
        const lowerCount = (password.match(/[a-z]/g) || []).length;
        const upperCount = (password.match(/[A-Z]/g) || []).length;
        const numberCount = (password.match(/[0-9]/g) || []).length;
        const symbolCount = (password.match(/[^a-zA-Z0-9]/g) || []).length;

        // Update character counts
        lowerChars.textContent = lowerCount;
        upperChars.textContent = upperCount;
        numberChars.textContent = numberCount;
        symbolChars.textContent = symbolCount;

        // Add color indicators based on presence
        lowerChars.className = `font-opensans ${lowerCount > 0 ? 'text-green-500' : 'text-gray-500'}`;
        upperChars.className = `font-opensans ${upperCount > 0 ? 'text-green-500' : 'text-gray-500'}`;
        numberChars.className = `font-opensans ${numberCount > 0 ? 'text-green-500' : 'text-gray-500'}`;
        symbolChars.className = `font-opensans ${symbolCount > 0 ? 'text-green-500' : 'text-gray-500'}`;
      }

      // Show/Hide Password functionality
      showPasswordCheckbox.addEventListener("change", function() {
        passwordInput.type = this.checked ? "text" : "password";
      });

      // Theme toggle functionality
      function toggleTheme() {
        document.documentElement.classList.toggle("dark");
        const isDark = document.documentElement.classList.contains("dark");
        sunIcon.classList.toggle("hidden", isDark);
        moonIcon.classList.toggle("hidden", !isDark);
        localStorage.setItem("theme", isDark ? "dark" : "light");
      }

      // Check for saved theme preference
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
        sunIcon.classList.remove("hidden");
        moonIcon.classList.add("hidden");
      }

      themeToggle.addEventListener("click", toggleTheme);

      function checkPasswordStrength(password) {
        // Initialize variables
        const length = password.length;
        let charSetSize = 0;
        let strength = "None";
        let reason = "";
        let timeToCrack = "0 Second";

        // Update character counts
        updateCharacterCounts(password);

        // Check character types
        const hasLower = /[a-z]/.test(password);
        const hasUpper = /[A-Z]/.test(password);
        const hasNumber = /\d/.test(password);
        const hasSymbol = /[^a-zA-Z0-9]/.test(password);

        // Calculate character set size
        if (hasLower) charSetSize += 26;
        if (hasUpper) charSetSize += 26;
        if (hasNumber) charSetSize += 10;
        if (hasSymbol) charSetSize += 32; // Approximate for common symbols

        // Estimate time to crack (10 billion guesses per second)
        if (length > 0 && charSetSize > 0) {
          const guesses = Math.pow(charSetSize, length);
          const seconds = guesses / 10_000_000_000;
          if (seconds < 60) {
            timeToCrack = `${seconds.toFixed(2)} seconds`;
          } else if (seconds < 3600) {
            timeToCrack = `${(seconds / 60).toFixed(2)} minutes`;
          } else if (seconds < 86400) {
            timeToCrack = `${(seconds / 3600).toFixed(2)} hours`;
          } else if (seconds < 31536000) {
            timeToCrack = `${(seconds / 86400).toFixed(2)} days`;
          } else {
            timeToCrack = `${(seconds / 31536000).toFixed(2)} years`;
          }
        }

        // Determine strength and reason
        const varietyCount = [hasLower, hasUpper, hasNumber, hasSymbol].filter(
          Boolean
        ).length;

        if (length === 0) {
          strength = "None";
          reason = "Enter a password to see the analysis.";
        } else if (length < 8 || varietyCount <= 2) {
          strength = "Weak";
          reason = length < 8 ? "Too short" : "Low character variety";
          if (varietyCount === 1) {
            if (hasLower) reason += " and only lowercase letters";
            else if (hasUpper) reason += " and only uppercase letters";
            else if (hasNumber) reason += " and only numbers";
            else reason += " and only symbols";
          } else if (varietyCount === 2) {
            reason += " and limited character types";
          }
        } else if (length >= 8 && length < 12 && varietyCount >= 3) {
          strength = "Moderate";
          reason = "Decent length and variety, but could be longer";
        } else if (length >= 12 && varietyCount >= 3) {
          strength = "Strong";
          reason =
            "Strong: includes multiple character types and is over 12 characters";
        }

        // Update DOM with Tailwind classes
        strengthDiv.innerText = `Strength: ${strength}`;
        strengthDiv.className = `text-lg font-bold my-2.5 font-montserrat dark:text-white ${
          strength === "Weak"
            ? "text-red-500 dark:text-red-400"
            : strength === "Moderate"
            ? "text-orange-500 dark:text-orange-400"
            : strength === "Strong"
            ? "text-green-500 dark:text-green-400"
            : "text-gray-700 dark:text-gray-300"
        }`;
        document.getElementById("timeToCrack").innerText = timeToCrack;
        reasonDiv.innerText = reason;
      }

      // Real-time input handling
      passwordInput.addEventListener("input", () => {
        checkPasswordStrength(passwordInput.value);
      });

      // Initial check
      checkPasswordStrength("");
    </script>
  </body>
</html>
